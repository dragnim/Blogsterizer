<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}The Blogsterizer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</head>
<body>
<header class="site-header">
    <div class="site-header-inner">
        <a class="brand" href="/">The Blogsterizer <span class="version">v{{ version }}</span></a>
        <div class="header-actions">{% block header_actions %}{% endblock %}</div>
    </div>
</header>
<main>
    {% block content %}{% endblock %}
</main>
<footer class="site-footer">
    <span>The Blogsterizer v{{ version }}</span>
</footer>
</body>
</html>
